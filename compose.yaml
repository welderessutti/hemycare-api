services:
  postgres:
    image: postgres:17
    container_name: hemycare-postgres
    environment:
      POSTGRES_DB: hemycare
      POSTGRES_USER: hemycare
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
